name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Lint with ruff
        run: ruff check app/ tests/
        working-directory: backend

  backend-tests:
    name: Backend — Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peblo
          POSTGRES_PASSWORD: peblo_secret
          POSTGRES_DB: peblo_tv_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+asyncpg://peblo:peblo_secret@localhost:5432/peblo_tv_test
      SECRET_KEY: ci_test_secret_key
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /tmp/peblo_storage
      CATALOGUE_DIR: /tmp/peblo_catalogue

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Run migrations
        run: alembic upgrade head
        working-directory: backend

      - name: Run tests
        run: pytest -v --tb=short
        working-directory: backend

  # ── CMS ─────────────────────────────────────────────────────────────────────
  cms-check:
    name: CMS — TypeCheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cms/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cms

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: cms

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000
        working-directory: cms

  # ── Viewer ───────────────────────────────────────────────────────────────────
  viewer-check:
    name: Viewer — TypeCheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: viewer

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: viewer

      - name: Build
        run: npm run build
        env:
          VITE_CATALOG_API_URL: http://localhost:8000
        working-directory: viewer

  # ── Docker image builds ──────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend-tests, cms-check, viewer-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: peblo-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build CMS image
        uses: docker/build-push-action@v5
        with:
          context: ./cms
          push: false
          tags: peblo-cms:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Viewer image
        uses: docker/build-push-action@v5
        with:
          context: ./viewer
          push: false
          tags: peblo-viewer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

