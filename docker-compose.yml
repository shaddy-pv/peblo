services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: peblo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblo_secret
      POSTGRES_DB: peblo_tv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo -d peblo_tv"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - peblo_net

  # ── Backend (FastAPI) ───────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peblo_api
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://peblo:peblo_secret@db:5432/peblo_tv
      SECRET_KEY: ${SECRET_KEY:-dev_secret_change_in_production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/storage
      LOCAL_STORAGE_BASE_URL: http://localhost:8000/storage
      CATALOGUE_DIR: /app/catalogue
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    volumes:
      # Artwork storage — persisted across restarts
      - artwork_storage:/app/storage
      # Catalogue output — persisted
      - catalogue_data:/app/catalogue
      # Dev hot-reload (commented out for production builds)
      # - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - peblo_net

  # ── API migration runner (runs once then exits) ────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peblo_migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://peblo:peblo_secret@db:5432/peblo_tv
      PYTHONPATH: /app
    volumes:
      - artwork_storage:/app/storage
      - catalogue_data:/app/catalogue
    command: ["sh", "-c", "alembic upgrade head && python -m app.scripts.seed"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - peblo_net
    # Run once and exit — restart: "no" is default
    restart: "no"

  # ── CMS (React + TypeScript) ────────────────────────────────────────────────
  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: peblo_cms
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - peblo_net

  # ── Viewer (React + TypeScript) ─────────────────────────────────────────────
  viewer:
    build:
      context: ./viewer
      dockerfile: Dockerfile
      args:
        VITE_CATALOG_API_URL: http://localhost:8000
    container_name: peblo_viewer
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - api
    networks:
      - peblo_net

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  artwork_storage:
    driver: local
  catalogue_data:
    driver: local

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  peblo_net:
    driver: bridge
